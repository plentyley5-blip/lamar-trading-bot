function candleChartSvg(rows){const data=(rows||[]).slice(-45);if(!data.length)return '<div class="muted small" style="padding:35px;text-align:center">No candle history available.</div>';const hi=Math.max(...data.map(x=>Number(x.high)||0)),lo=Math.min(...data.map(x=>Number(x.low)||0)),range=Math.max(hi-lo,0.0000001),top=14,bottom=254,w=900,step=w/data.length,body=Math.max(4,step*.5);const y=v=>top+(hi-Number(v))/range*(bottom-top);let grid="";for(let i=0;i<5;i++){const yy=top+i*(bottom-top)/4,price=hi-i*range/4;grid+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="900" y2="'+yy.toFixed(1)+'" stroke="#294768" stroke-opacity=".6" stroke-dasharray="4 5"/><text x="895" y="'+(yy-4).toFixed(1)+'" fill="#AFC0D2" text-anchor="end" font-size="10">'+safe(price.toPrecision(7))+'</text>'}const bars=data.map((c,i)=>{const x=i*step+step/2,up=Number(c.close)>=Number(c.open),colour=up?"#36D399":"#FF6378",yo=y(c.open),yc=y(c.close),yt=y(c.high),yb=y(c.low),height=Math.max(2,Math.abs(yc-yo));return '<line x1="'+x.toFixed(1)+'" y1="'+yt.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+yb.toFixed(1)+'" stroke="'+colour+'" stroke-width="2"/><rect x="'+(x-body/2).toFixed(1)+'" y="'+Math.min(yo,yc).toFixed(1)+'" width="'+body.toFixed(1)+'" height="'+height.toFixed(1)+'" rx="1" fill="'+colour+'"/>'}).join("");return '<svg viewBox="0 0 900 270" width="100%" role="img" aria-label="Candlestick chart">'+grid+bars+'</svg>'}

async function compressFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("The selected chart could not be read."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("The selected chart is not a supported image."));img.onload=()=>{const scale=Math.min(1,2200/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let quality=.88,data=canvas.toDataURL("image/jpeg",quality);while(data.length>1450000&&quality>.48){quality-=.08;data=canvas.toDataURL("image/jpeg",quality)}if(data.length>1500000)return reject(new Error("The image is too large. Choose a smaller screenshot."));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
async function submitAnalysis(){state.analysisError="";if(!canAnalyze()&&!isOwner()){state.sub="PLANS";return render()}if(!state.selectedInstrument){state.analysisError="Choose an instrument.";render();return}if(!state.images.H4||!state.images.M15){state.analysisError="Upload both 4H and 15M charts first.";render();return}for(const x of state.optionalTimeframes){if(!state.images[x]){state.analysisError="Upload the selected "+x+" optional chart or remove its selection.";render();return}}state.analysisBusy=true;render();try{const additional={};state.optionalTimeframes.forEach(x=>additional[x]=state.images[x]);const submit=await api("/analysis_submit",{method:"POST",body:{instrument:state.selectedInstrument,trade_focus:state.focus,higher_timeframe_image:state.images.H4,lower_timeframe_image:state.images.M15,additional_timeframe_images:additional}});if(!submit.job_id)throw new Error("The analysis job was not created.");let result=null;for(let i=0;i<75;i++){await new Promise(r=>setTimeout(r,2000));const status=await api("/analysis_status?job_id="+encodeURIComponent(submit.job_id));if(status.status==="completed"){result=status.result||{};break}if(status.status==="failed")throw new Error(status.error||"The analysis did not complete.")}if(!result)throw new Error("The analysis is taking longer than expected. Check Trade history shortly.");state.analysisResult=result;await loadProfile()}catch(e){state.analysisError=e.message}finally{state.analysisBusy=false;render()}}

async function startup(){if(!state.token){render();return}try{await loadProfile();render();loadDashboardStats();if(canNews())loadNews();}catch(e){if(state.refresh){try{await refreshSession();await loadProfile();render();loadDashboardStats();return}catch(_){}}await logout();state.message=e.message;state.msgType="error";render()}}
document.addEventListener("click",async e=>{
 const page=e.target.closest("[data-page]");if(page)return go(page.dataset.page);
 const sub=e.target.closest("[data-sub]");if(sub){const s=sub.dataset.sub;if(s==="LOGOUT")return logout();if(s==="SHARE"){try{await navigator.clipboard.writeText(location.href);showMsg("Website link copied.","success")}catch(_){showMsg(location.href)}return}return openSub(s)}
 const act=e.target.closest("[data-act]");if(act){const a=act.dataset.act;try{
 if(a==="back")back();
 if(a==="refresh-history"){await loadHistory();render()}
 if(a==="back-trade"){state.selectedHistoryId="";render()}
 if(a==="delete-account"){if(window.confirm("Permanently delete this LM Analyzer account? This cannot be undone.")){try{await api("/delete_account",{method:"DELETE"});await logout();showMsg("Account deleted.","success")}catch(e){showMsg(e.message,"error")}}}
 if(a==="refresh-community")loadCommunity();
 if(a==="publish-community")publishCommunity();
 if(a==="refresh-markets")loadMarkets();
 if(a==="back-markets"){state.marketSelectedSymbol="";state.marketCandles=[];render()}
 if(a==="use-market-analysis"){state.selectedInstrument=state.marketSelectedSymbol;state.marketSelectedSymbol="";openSub("ANALYZER")};
 if(a==="refresh-news")loadNews();
 if(a==="refresh-news-signal")loadNewsSignal();
 if(a==="submit-analysis")submitAnalysis();
 if(a==="refresh-autotrader")loadAutoTrader();
 if(a==="refresh-admin-monitor")loadAdminMonitorWeb();
 if(a==="send-chat")sendSupportMessageWeb();
 if(a==="submit-lesson-quiz")submitLessonQuiz();
 if(a==="request-human")requestHumanSupportWeb();
 if(a==="calculate-risk"){const bal=Number($("risk-balance")?.value),pct=Number($("risk-percent")?.value),entry=Number($("risk-entry")?.value),stop=Number($("risk-stop")?.value),target=Number($("risk-target")?.value);const valid=bal>0&&pct>0&&pct<=10;const risk=bal*pct/100;const dist=Math.abs(entry-stop),rr=dist>0?Math.abs(target-entry)/dist:NaN;$("risk-result").innerHTML='<div class="divider"></div><div class="info-line"><span>Planned cash risk</span><strong>'+(valid?risk.toFixed(2):"Enter balance and a risk percentage up to 10%")+'</strong></div><div class="info-line"><span>Price-distance R:R</span><strong>'+(Number.isFinite(rr)&&rr>0?"1 : "+rr.toFixed(2):"Enter valid entry, stop and target")+'</strong></div>'}
 if(a==="save-journal"){const body={action:"journal",instrument:$("journal-instrument").value.trim().toUpperCase(),direction:$("journal-direction").value,account_balance:Number($("journal-balance").value),risk_percent:Number($("journal-risk").value),entry_price:Number($("journal-entry").value)||null,stop_loss:Number($("journal-stop").value)||null,take_profit:Number($("journal-target").value)||null,outcome:$("journal-outcome").value,notes:$("journal-notes").value};await api("/trader_tools?action=journal",{method:"POST",body});showMsg("Journal entry saved.","success");await loadJournal()}
 if(a==="send-feedback"){await api("/trader_tools?action=feedback",{method:"POST",body:{action:"feedback",category:$("feedback-type").value,message:$("feedback-message").value}});showMsg("Feedback submitted.","success")}
 if(a==="android-purchase")showMsg("Open LM Analyzer on Android and select the same plan to complete Google Play checkout. No browser payment has been started.","notice");
 if(a==="test-notification"){if(!("Notification"in window))throw new Error("This browser does not support desktop notifications.");const permission=await Notification.requestPermission();if(permission==="granted")new Notification("LM Analyzer",{body:"Browser notification test."});else throw new Error("Notification permission was not granted.")}
 }catch(err){showMsg(err.message,"error")}return}
 const like=e.target.closest("[data-like-post]");if(like){togglePostLike(like.dataset.likePost);return}const comments=e.target.closest("[data-comments]");if(comments){loadPostComments(comments.dataset.comments);return}const sendComment=e.target.closest("[data-send-comment]");if(sendComment){sendPostComment(sendComment.dataset.sendComment);return}const lesson=e.target.closest("[data-lesson]");if(lesson){state.selectedLessonId=lesson.dataset.lesson;state.selectedQuizOption=null;state.quizFeedback="";render();return}const answer=e.target.closest("[data-quiz-answer]");if(answer){state.selectedQuizOption=Number(answer.dataset.quizAnswer);state.quizFeedback="";render();return}const historyItem=e.target.closest("[data-history-id]");if(historyItem){state.selectedHistoryId=historyItem.dataset.historyId;render();return}const filter=e.target.closest("[data-filter]");if(filter){state.historyFilter=filter.dataset.filter;render();return}
 const cat=e.target.closest("[data-category]");if(cat){state.marketCategory=cat.dataset.category;loadMarkets();return}const md=e.target.closest("[data-market-detail]");if(md){state.marketSelectedSymbol=md.dataset.marketDetail;state.marketInterval="15min";state.marketCandles=[];render();loadMarketCandles();return}const interval=e.target.closest("[data-interval]");if(interval){state.marketInterval=interval.dataset.interval;loadMarketCandles();return}const alertAnalysis=e.target.closest("[data-alert-analysis]");if(alertAnalysis){state.selectedInstrument=alertAnalysis.dataset.alertAnalysis;openSub("ANALYZER");return}
 const plan=e.target.closest("[data-plan]");if(plan){state.selectedPlan=plan.dataset.plan;render();return}
 const instr=e.target.closest("[data-instrument]");if(instr){state.selectedInstrument=instr.dataset.instrument;render();return}
 const foc=e.target.closest("[data-focus]");if(foc){state.focus=foc.dataset.focus;render();return}
 const opt=e.target.closest("[data-optional]");if(opt){const key=opt.dataset.optional;state.optionalTimeframes=state.optionalTimeframes.includes(key)?state.optionalTimeframes.filter(x=>x!==key):state.optionalTimeframes.concat([key]);render();return}
 const homeNews=e.target.closest("[data-home-news]");if(homeNews){if(!canNews())return openSub("PLANS");state.selectedEvent=state.news[Number(homeNews.dataset.homeNews)];state.sub="NEWS_INSTRUMENTS";render();return}const ev=e.target.closest("[data-event]");if(ev){state.selectedEvent=state.news[Number(ev.dataset.event)];state.sub="NEWS_INSTRUMENTS";render();return}
 const ni=e.target.closest("[data-news-instrument]");if(ni){state.selectedNewsInstrument=ni.dataset.newsInstrument;state.sub="NEWS_SIGNAL";render();loadNewsSignal();return}
 const market=e.target.closest("[data-analyse-market]");if(market){state.selectedInstrument=market.dataset.analyseMarket;openSub("ANALYZER");return}
 const appearance=e.target.closest("[data-appearance]");if(appearance){state.appearance=appearance.dataset.appearance;localStorage.setItem("lm_appearance",state.appearance);showMsg("Appearance preference saved for this browser.","success");return}
 const toolIndex=e.target.closest("[data-tool-index]");if(toolIndex){state.toolIndex=Number(toolIndex.dataset.toolIndex)||0;render();return}const toolAction=e.target.closest("[data-tool-action]");if(toolAction){const action=toolAction.dataset.toolAction;if(action==="HIGH_IMPACT_NEWS")return openSub("HIGH_IMPACT_NEWS");if(action==="BROKER"){window.open("https://one.exnessonelink.com/a/gzhynodvm1","_blank","noopener");return}if(action==="COMMUNITY_LINK"){window.open("https://t.me/lamar_fx958","_blank","noopener");return}}const memberDirection=e.target.closest("[data-member-direction]");if(memberDirection){state.communityMemberDirection=memberDirection.dataset.memberDirection;state.sub=state.communityMemberDirection.toUpperCase();loadCommunityMembersWeb();render();return}const follow=e.target.closest("[data-toggle-follow]");if(follow){toggleCommunityFollow(follow.dataset.toggleFollow,follow.dataset.following==="true");return}const url=e.target.closest("[data-url]");if(url){window.open(url.dataset.url,"_blank","noopener");return}
});
document.addEventListener("change",async e=>{
 if(e.target.matches("[data-file]")){const key=e.target.dataset.file,file=e.target.files&&e.target.files[0];if(!file)return;try{state.images[key]=await compressFile(file);render()}catch(err){showMsg(err.message,"error")}}if(e.target.id==="profile-avatar"){const file=e.target.files&&e.target.files[0];if(file){try{const image_data_url=await compressFile(file);await api("/community",{method:"POST",body:{action:"profile_avatar",image_data_url}});await loadCommunityProfileWeb()}catch(err){showMsg(err.message,"error")}}}if(e.target.id==="community-image"){const file=e.target.files&&e.target.files[0];if(file){try{state.communityImage=await compressFile(file);render()}catch(err){showMsg(err.message,"error")}}}
 if(e.target.id==="notifications-toggle"){state.notifications=e.target.checked;localStorage.setItem("lm_web_notifications",String(state.notifications));if(state.notifications&&"Notification"in window){const p=await Notification.requestPermission();if(p!=="granted"){state.notifications=false;localStorage.setItem("lm_web_notifications","false");render()}}}
});
document.addEventListener("keydown",e=>{if(e.target.id==="auth-password"&&e.key==="Enter")submitAuth()});
startup();
setInterval(()=>{state.toolIndex=(state.toolIndex+1)%3;if(state.page==="HOME"&&!state.sub)render()},10000);
setInterval(()=>{if(state.token)loadDashboardStats()},60000);
setInterval(()=>{if(state.token&&canNews())loadNews()},600000);
setInterval(()=>{if(state.token&&state.page==="MARKETS"&&!state.sub){if(state.marketSelectedSymbol)loadMarketCandles();else loadMarkets()}},60000);
setInterval(()=>{if(state.token&&state.sub==="LIVE_CHAT"&&state.chatConversationId&&!state.chatBusy)loadSupportSnapshotWeb(true)},4000);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body></html>
