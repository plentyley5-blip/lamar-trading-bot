/* Native LM Analyzer authentication parity */
.auth-screen{position:relative;isolation:isolate;width:min(100%,720px);min-height:100svh;margin:0 auto;padding:45px 24px 34px;display:flex;flex-direction:column;align-items:stretch}
.auth-screen:before,.auth-screen:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(.2px)}
.auth-screen:before{width:330px;height:330px;right:-115px;top:-70px;background:rgba(22,119,255,.13)}
.auth-screen:after{width:290px;height:290px;left:-155px;bottom:-115px;background:rgba(47,140,255,.08)}
.auth-brand-native{text-align:center;margin:0 0 28px}
.auth-brand-native h1{margin:0;color:#fff;font-size:30px;line-height:1.2;font-weight:950;letter-spacing:-.6px}
.auth-brand-native p{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.15px}
.auth-card-native{width:100%;max-width:640px;margin:0 auto;padding:20px;background:rgba(11,32,56,.82);border:1px solid rgba(255,255,255,.035);border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.12);position:relative;z-index:1}
.auth-card-native h2{margin:0;color:#fff;font-size:22px;line-height:1.25;font-weight:800}
.auth-card-native .auth-subtitle{margin:7px 0 18px;color:var(--muted);font-size:13px}
.auth-form-native{display:flex;flex-direction:column;gap:10px}
.auth-input-wrap{position:relative;z-index:2;width:100%;margin:0;pointer-events:auto}
.auth-input-native{display:block;position:relative;z-index:2;width:100%;height:56px;padding:0 20px;border:1.5px solid #294768;border-radius:7px;background:rgba(3,11,24,.18);color:#fff;font-size:18px;line-height:1.25;outline:none;opacity:1;pointer-events:auto;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.auth-input-native::placeholder{color:#AFC0D2;opacity:1}
.auth-input-native:focus{border-color:#2F8CFF;box-shadow:0 0 0 3px rgba(47,140,255,.12)}
.auth-password-wrap{position:relative}
.auth-password-wrap .auth-input-native{padding-right:58px}
.auth-eye{position:absolute;z-index:3;right:12px;top:50%;transform:translateY(-50%);width:34px;height:38px;border:0;background:transparent;color:#2F8CFF;display:grid;place-items:center;padding:0}
.auth-eye svg{width:23px;height:23px;display:block}
.auth-submit-native{width:100%;height:54px;margin-top:8px;border:0;border-radius:999px;background:#1677FF;color:white;font-size:16px;font-weight:900;letter-spacing:.1px;box-shadow:none}
.auth-submit-native:disabled{opacity:.7}
.auth-divider-native{display:flex;align-items:center;gap:12px;margin:20px 0 18px;color:var(--muted);font-size:14px;justify-content:center}
.auth-divider-native:before,.auth-divider-native:after{content:"";height:1px;flex:1;background:#294768}
.google-signin-native{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center}
.google-fallback-native{width:100%;height:52px;border:1px solid #DADCE0;border-radius:13px;background:#fff;color:#202124;font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:12px}
.google-fallback-native svg{width:27px;height:27px;flex:0 0 27px}
.google-signin-native iframe{max-width:100%}
.auth-toggle-native{display:block;width:100%;margin:30px 0 0;padding:6px 4px;border:0;background:transparent;color:#2F8CFF;font-size:16px;font-weight:700;text-align:center}
.auth-screen .error,.auth-screen .success,.auth-screen .notice{margin-top:10px}

function candleChartSvg(rows){const data=(rows||[]).slice(-45);if(!data.length)return '<div class="muted small" style="padding:35px;text-align:center">No candle history available.</div>';const hi=Math.max(...data.map(x=>Number(x.high)||0)),lo=Math.min(...data.map(x=>Number(x.low)||0)),range=Math.max(hi-lo,0.0000001),top=14,bottom=254,w=900,step=w/data.length,body=Math.max(4,step*.5);const y=v=>top+(hi-Number(v))/range*(bottom-top);let grid="";for(let i=0;i<5;i++){const yy=top+i*(bottom-top)/4,price=hi-i*range/4;grid+='<line x1="0" y1="'+yy.toFixed(1)+'" x2="900" y2="'+yy.toFixed(1)+'" stroke="#294768" stroke-opacity=".6" stroke-dasharray="4 5"/><text x="895" y="'+(yy-4).toFixed(1)+'" fill="#AFC0D2" text-anchor="end" font-size="10">'+safe(price.toPrecision(7))+'</text>'}const bars=data.map((c,i)=>{const x=i*step+step/2,up=Number(c.close)>=Number(c.open),colour=up?"#36D399":"#FF6378",yo=y(c.open),yc=y(c.close),yt=y(c.high),yb=y(c.low),height=Math.max(2,Math.abs(yc-yo));return '<line x1="'+x.toFixed(1)+'" y1="'+yt.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+yb.toFixed(1)+'" stroke="'+colour+'" stroke-width="2"/><rect x="'+(x-body/2).toFixed(1)+'" y="'+Math.min(yo,yc).toFixed(1)+'" width="'+body.toFixed(1)+'" height="'+height.toFixed(1)+'" rx="1" fill="'+colour+'"/>'}).join("");return '<svg viewBox="0 0 900 270" width="100%" role="img" aria-label="Candlestick chart">'+grid+bars+'</svg>'}

function compressSupportImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onerror=()=>reject(new Error("The selected image could not be read."));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("Choose a valid JPG, PNG or WEBP image."));img.onload=()=>{
   const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext("2d");if(!ctx)return reject(new Error("Image compression is unavailable in this browser."));ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let quality=.84,data=canvas.toDataURL("image/jpeg",quality);while(data.length>680000&&quality>.38){quality-=.08;data=canvas.toDataURL("image/jpeg",quality)}
   if(data.length>700000)return reject(new Error("This image is too large. Choose a smaller screenshot."));resolve(data);
  };img.src=reader.result};reader.readAsDataURL(file);
 });
}
