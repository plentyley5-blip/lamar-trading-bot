(function(){

const API="https://lamar-trading-bot.vercel.app/api";
const PLANS=[
 {key:"weekly",title:"Weekly",price:"USD 9.23",description:"7 days · 5 analyses per day"},
 {key:"monthly",title:"Monthly",price:"USD 25.21",description:"1 month · 10 analyses per day"},
 {key:"three_months",title:"3 Months",price:"USD 63.69",description:"3 months · 30 analyses per day",badge:"MOST POPULAR"},
 {key:"six_months",title:"6 Months",price:"USD 127.38",description:"6 months · 50 analyses per day"}
];
const GROUPS=[
 {name:"Major Forex",items:["EURUSD","GBPUSD","USDJPY","USDCHF","USDCAD","AUDUSD","NZDUSD"]},
 {name:"Forex Crosses",items:["EURGBP","EURJPY","EURCHF","EURAUD","EURCAD","EURNZD","GBPJPY","GBPCHF","GBPAUD","GBPCAD","GBPNZD","AUDJPY","AUDCAD","AUDCHF","AUDNZD","CADJPY","CADCHF","CHFJPY","NZDJPY","NZDCAD","NZDCHF"]},

 EUR:["EURUSD","EURGBP","EURJPY","EURCHF","EURAUD","EURCAD","EURNZD"],
 GBP:["GBPUSD","EURGBP","GBPJPY","GBPCHF","GBPAUD","GBPCAD","GBPNZD"],

};
const MARKET_CATEGORIES=["Forex","Metals","Indices","Energy","Crypto","Stocks"];
const state={
 token:localStorage.getItem("lm_access_token")||"",refresh:localStorage.getItem("lm_refresh_token")||"",
 profile:null,page:"HOME",toolIndex:0,sub:"",authMode:"login",busy:false,message:"",error:"",
 history:[],historyFilter:"ALL",quotes:[],marketCategory:"Forex",marketBusy:false,marketError:"",
 news:[],newsBusy:false,newsError:"",selectedEvent:null,selectedNewsInstrument:"",
 newsSignal:null,newsSignalBusy:false,newsSignalError:"",
 selectedInstrument:"EURUSD",focus:"DAY TRADE",optionalTimeframes:[],images:{H4:"",M15:"",D1:"",H1:"",M5:"",M1:""},analysisBusy:false,analysisError:"",analysisResult:null,
 communityPosts:[],communityBusy:false,communityError:"",communityCanPost:false,

 appearance:localStorage.getItem("lm_appearance")||"blue",notifications:localStorage.getItem("lm_web_notifications")==="true"

const $=id=>document.getElementById(id);
const safe=v=>String(v===undefined||v===null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc=safe;
function errText(raw,fallback){try{const o=JSON.parse(raw);return o.error||o.message||fallback}catch(_){return raw||fallback}}
async function api(path,options){
 options=options||{};const method=options.method||"GET",body=options.body===undefined?null:options.body,auth=options.auth!==false;
 const headers={"Accept":"application/json"};if(body!==null)headers["Content-Type"]="application/json";if(auth&&state.token)headers.Authorization="Bearer "+state.token;
 const response=await fetch(API+path,{method,headers,body:body===null?undefined:JSON.stringify(body),cache:"no-store"});
 const raw=await response.text();if(!response.ok)throw new Error(errText(raw,"Request failed ("+response.status+")."));
 try{return raw?JSON.parse(raw):{}}catch(_){return {message:raw}}
}
function profile(){return state.profile||{}}
function isOwner(){return !!profile().is_owner}
function quotaType(){return String(profile().quota_type||"blocked")}
function canAnalyze(){const p=profile();return isOwner()||((p.quota_type==="free_lifetime"||(p.quota_type==="paid_daily"&&p.subscription_active))&&p.analysis_allowed!==false&&Number(p.remaining||0)>0)}
function canNews(){return isOwner()||(quotaType()==="paid_daily"&&!!profile().subscription_active)}
function allowanceText(){const p=profile();if(isOwner())return "Founder · Unlimited";if(p.quota_type==="free_lifetime")return Number(p.used||0)+" / "+Number(p.lifetime_limit||4)+" lifetime";if(p.quota_type==="paid_daily")return Number(p.used||0)+" / "+Number(p.daily_limit||0)+" today";return "Access paused"}
function head(){const p=profile(),initial=(p.full_name||p.email||"L").trim().charAt(0).toUpperCase();return '<header class="brandbar"><div class="brand-lockup"><div class="brand-mark">LM</div><div><div class="brand-name">LM ANALYZER</div><div class="brand-sub">LAMAR TRADING BOT</div></div></div><div class="user-chip"><div class="avatar">'+safe(initial)+'</div><div><div class="user-name">'+safe(p.full_name||"Trader")+'</div><div class="user-state">'+safe(allowanceText())+'</div></div></div></header>'}
function nav(){const items=["HOME","TRADE","COMMUNITY","MARKETS","TOOLS","PROFILE"];return '<nav class="bottom-nav">'+items.map(x=>'<button class="nav-item '+(state.page===x?"active":"")+'" data-page="'+x+'">'+x+'</button>').join("")+'</nav>'}

async function compressFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("The selected chart could not be read."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("The selected chart is not a supported image."));img.onload=()=>{const scale=Math.min(1,2200/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let quality=.88,data=canvas.toDataURL("image/jpeg",quality);while(data.length>1450000&&quality>.48){quality-=.08;data=canvas.toDataURL("image/jpeg",quality)}if(data.length>1500000)return reject(new Error("The image is too large. Choose a smaller screenshot."));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
async function submitAnalysis(){state.analysisError="";if(!canAnalyze()&&!isOwner()){state.sub="PLANS";return render()}if(!state.selectedInstrument){state.analysisError="Choose an instrument.";render();return}if(!state.images.H4||!state.images.M15){state.analysisError="Upload both 4H and 15M charts first.";render();return}for(const x of state.optionalTimeframes){if(!state.images[x]){state.analysisError="Upload the selected "+x+" optional chart or remove its selection.";render();return}}state.analysisBusy=true;render();try{const additional={};state.optionalTimeframes.forEach(x=>additional[x]=state.images[x]);const submit=await api("/analysis_submit",{method:"POST",body:{instrument:state.selectedInstrument,trade_focus:state.focus,higher_timeframe_image:state.images.H4,lower_timeframe_image:state.images.M15,additional_timeframe_images:additional}});if(!submit.job_id)throw new Error("The analysis job was not created.");let result=null;for(let i=0;i<75;i++){await new Promise(r=>setTimeout(r,2000));const status=await api("/analysis_status?job_id="+encodeURIComponent(submit.job_id));if(status.status==="completed"){result=status.result||{};break}if(status.status==="failed")throw new Error(status.error||"The analysis did not complete.")}if(!result)throw new Error("The analysis is taking longer than expected. Check Trade history shortly.");state.analysisResult=result;await loadProfile()}catch(e){state.analysisError=e.message}finally{state.analysisBusy=false;render()}}
async function loadNews(){state.newsBusy=true;state.newsError="";render();try{const r=await api("/news?refresh="+Date.now());state.news=(r.events||[]).filter(e=>String(e.impact||"").toLowerCase()==="high")}catch(e){state.newsError=e.message}finally{state.newsBusy=false;render()}}
function newsView(){return subHeader("High Impact News","Verified high-impact Forex economic events")+'<section class="glass card"><div class="row-between"><div class="eyebrow" style="color:var(--gold)">UPCOMING EVENTS</div><button class="btn outline" data-act="refresh-news">↻ REFRESH</button></div>'+(state.newsBusy?'<div class="loading"><span class="spinner"></span>Loading high-impact events…</div>':"")+(state.newsError?'<div class="error">'+safe(state.newsError)+'</div>':"")+(state.news.length?state.news.map((e,i)=>'<button class="news-row" style="width:100%;text-align:left;color:white" data-event="'+i+'"><span class="currency">'+safe(e.currency)+'</span><span style="flex:1"><span class="news-meta">'+safe(e.date)+" · "+safe(e.time)+'</span><span class="news-title" style="display:block;margin-top:3px">'+safe(e.title||e.event)+'</span><span class="news-meta" style="display:block;margin-top:5px;color:var(--red)">Expected volatility: High</span></span><span style="color:var(--bright)">›</span></button>').join(""):'<div class="muted small" style="padding:28px;text-align:center">◷<h3 style="color:white">No High Impact News</h3>'+(state.newsError?"The calendar is unavailable.":"There are currently no scheduled high-impact Forex events.")+'</div>')+'</section>'}
function instrumentView(){const e=state.selectedEvent||{};const list=RELATED[String(e.currency||"").toUpperCase()]||[];return subHeader("Related Instruments",(e.currency||"")+" · "+(e.title||"News event"))+'<section class="glass card"><div class="eyebrow" style="color:var(--gold)">SELECT A MARKET</div><p class="muted small">Choose an instrument for its news-based AI outlook.</p>'+list.map(s=>'<button class="option" data-news-instrument="'+s+'"><span><strong>'+s+'</strong><small>'+safe(instrumentName(s))+'</small></span><span class="pill blue">AI OUTLOOK ›</span></button>').join("")+'</section>'}
function instrumentName(s){const names={EURUSD:"Euro / US Dollar",GBPUSD:"British Pound / US Dollar",USDJPY:"US Dollar / Japanese Yen",USDCHF:"US Dollar / Swiss Franc",USDCAD:"US Dollar / Canadian Dollar",AUDUSD:"Australian Dollar / US Dollar",NZDUSD:"New Zealand Dollar / US Dollar",XAUUSD:"Gold / US Dollar",XAGUSD:"Silver / US Dollar"};return names[s]||s}
async function loadNewsSignal(){state.newsSignalBusy=true;state.newsSignalError="";state.newsSignal=null;render();try{const snapshot=await api("/market_candles?symbol="+encodeURIComponent(state.selectedNewsInstrument)+"&interval=1min");if(snapshot.stale)throw new Error("Market candles are delayed. No live news signal can be issued.");const candles=(snapshot.candles||[]).slice(-100);if(candles.length<30||!snapshot.updated_at)throw new Error("At least 30 recent one-minute candles are required. No signal has been generated.");const r=await api("/news_signal",{method:"POST",body:{event:state.selectedEvent,instrument:state.selectedNewsInstrument,candles,market_data_updated_at:snapshot.updated_at,market_data_stale:!!snapshot.stale}});state.newsSignal=r}catch(e){state.newsSignalError=e.message}finally{state.newsSignalBusy=false;render()}}
function newsSignalView(){const e=state.selectedEvent||{},r=state.newsSignal||{};return subHeader("AI News Outlook",state.selectedNewsInstrument+" · "+(e.title||""))+'<section class="glass card">'+(state.newsSignalBusy?'<div class="loading"><span class="spinner"></span>Assessing live market reaction…</div>':"")+(state.newsSignalError?'<div class="error">'+safe(state.newsSignalError)+'</div><button class="btn outline full" data-act="refresh-news-signal">TRY AGAIN</button>':"")+(r.signal?'<div class="row-between"><div><div class="eyebrow">'+safe(r.stage||"NEWS STAGE")+'</div><h2 style="font-size:25px;margin:6px 0;color:'+(r.signal==="BUY"?"var(--green)":r.signal==="SELL"?"var(--red)":"var(--gold)")+'">'+safe(r.signal)+'</h2><div class="muted small">Confidence '+safe(r.confidence)+'%</div></div><div class="news-mark">✦</div></div><p class="muted small">'+safe(r.headline||r.event_bias||"")+'</p><div class="metric-grid">'+metric("Current price",r.current_price||"—")+metric("Entry",r.entry||"—")+metric("Stop loss",r.stop_loss||"—")+metric("TP1",r.take_profit_1||"—")+metric("TP2",r.take_profit_2||"—")+metric("Setup",r.setup_status||"—")+'</div><div class="divider"></div><strong>Reasons</strong><ul class="muted small">'+(r.reasons||[]).map(x=>'<li style="margin:7px 0">'+safe(x)+'</li>').join("")+'</ul><div class="notice">'+safe(r.warning||r.invalidation||"Review invalidation and market conditions before trading.")+'</div><div class="divider"></div><strong>Geopolitical intelligence</strong><p class="muted small">'+safe((r.geopolitical_intelligence||{}).summary||"No verified geopolitical context available.")+'</p>':"")+'<button class="btn outline full" style="margin-top:13px" data-act="refresh-news-signal">REFRESH OUTLOOK</button></section>'}

function traderStatsView(){const s=state.traderStats||{};const attention=Array.isArray(s.attention)?s.attention:[];return subHeader("TRADERS RIGHT NOW","Verified completed LM Analyzer analyses from the last 24 hours") + '<section class="glass card"><div class="eyebrow">ACTIVITY SUMMARY</div>'+metric("Completed AI analyses · 24h",s.total_analyses??"—")+metric("BUY analyses",s.buys??"—")+metric("SELL analyses",s.sells??"—")+metric("NO TRADE analyses",s.no_trade??"—")+metric("BUY share of directional signals",s.buy_percent==null?"Not enough data":Number(s.buy_percent).toFixed(1)+"%")+metric("SELL share of directional signals",s.sell_percent==null?"Not enough data":Number(s.sell_percent).toFixed(1)+"%")+'<p class="caption">Only BUY and SELL count toward directional percentages. NO TRADE is excluded. This is AI analysis sentiment, not traders’ actual positions.</p><div class="divider"></div><div class="eyebrow">WHERE THE ATTENTION IS</div>'+attention.map((x,i)=>'<div class="info-line"><span>'+(i+1)+". "+safe(x.symbol)+'</span><strong>'+safe(x.count)+' analyses</strong></div>').join("")+'</section>'}

function render(){const root=$("app");if(!state.token||!state.profile){root.innerHTML=authView();$("auth-toggle")?.addEventListener("click",()=>{state.authMode=state.authMode==="login"?"signup":"login";state.message="";render()});$("auth-submit")?.addEventListener("click",submitAuth);return}let body=state.sub?subView():({HOME:homeView,TRADE:tradeView,COMMUNITY:communityView,MARKETS:marketsView,TOOLS:toolsView,PROFILE:profileView}[state.page]||homeView)();root.innerHTML='<div class="shell"><main class="content">'+body+'</main></div>'+(!state.sub?nav():"");}

function openSub(s){state.sub=s;state.message="";if(s==="HIGH_IMPACT_NEWS"){if(!canNews()){state.sub="PLANS"}else loadNews()}if(s==="LEARNING")loadLessons();if(s==="JOURNAL")loadJournal();if(s==="MT5_AUTO_TRADER")loadAutoTrader();render()}

document.addEventListener("click",async e=>{
 const page=e.target.closest("[data-page]");if(page)return go(page.dataset.page);
 const sub=e.target.closest("[data-sub]");if(sub){const s=sub.dataset.sub;if(s==="LOGOUT")return logout();if(s==="SHARE"){try{await navigator.clipboard.writeText(location.href);showMsg("Website link copied.","success")}catch(_){showMsg(location.href)}return}return openSub(s)}
 const act=e.target.closest("[data-act]");if(act){const a=act.dataset.act;try{
 if(a==="back")back();
 if(a==="refresh-history"){await loadHistory();render()}

 if(a==="submit-analysis")submitAnalysis();
 if(a==="refresh-autotrader")loadAutoTrader();
 if(a==="calculate-risk"){const bal=Number($("risk-balance")?.value),pct=Number($("risk-percent")?.value),entry=Number($("risk-entry")?.value),stop=Number($("risk-stop")?.value),target=Number($("risk-target")?.value);const valid=bal>0&&pct>0&&pct<=10;const risk=bal*pct/100;const dist=Math.abs(entry-stop),rr=dist>0?Math.abs(target-entry)/dist:NaN;$("risk-result").innerHTML='<div class="divider"></div><div class="info-line"><span>Planned cash risk</span><strong>'+(valid?risk.toFixed(2):"Enter balance and a risk percentage up to 10%")+'</strong></div><div class="info-line"><span>Price-distance R:R</span><strong>'+(Number.isFinite(rr)&&rr>0?"1 : "+rr.toFixed(2):"Enter valid entry, stop and target")+'</strong></div>'}
 if(a==="save-journal"){const body={action:"journal",instrument:$("journal-instrument").value.trim().toUpperCase(),direction:$("journal-direction").value,account_balance:Number($("journal-balance").value),risk_percent:Number($("journal-risk").value),entry_price:Number($("journal-entry").value)||null,stop_loss:Number($("journal-stop").value)||null,take_profit:Number($("journal-target").value)||null,outcome:$("journal-outcome").value,notes:$("journal-notes").value};await api("/trader_tools?action=journal",{method:"POST",body});showMsg("Journal entry saved.","success");await loadJournal()}
 if(a==="send-feedback"){await api("/trader_tools?action=feedback",{method:"POST",body:{action:"feedback",feedback_type:$("feedback-type").value,message:$("feedback-message").value}});showMsg("Feedback submitted.","success")}
 if(a==="android-purchase")showMsg("Open LM Analyzer on Android and select the same plan to complete Google Play checkout. No browser payment has been started.","notice");
 if(a==="test-notification"){if(!("Notification"in window))throw new Error("This browser does not support desktop notifications.");const permission=await Notification.requestPermission();if(permission==="granted")new Notification("LM Analyzer",{body:"Browser notification test."});else throw new Error("Notification permission was not granted.")}
 }catch(err){showMsg(err.message,"error")}return}
 const filter=e.target.closest("[data-filter]");if(filter){state.historyFilter=filter.dataset.filter;render();return}
 const cat=e.target.closest("[data-category]");if(cat){state.marketCategory=cat.dataset.category;loadMarkets();return}
 const plan=e.target.closest("[data-plan]");if(plan){state.selectedPlan=plan.dataset.plan;render();return}
 const instr=e.target.closest("[data-instrument]");if(instr){state.selectedInstrument=instr.dataset.instrument;render();return}
 const foc=e.target.closest("[data-focus]");if(foc){state.focus=foc.dataset.focus;render();return}
 const opt=e.target.closest("[data-optional]");if(opt){const key=opt.dataset.optional;state.optionalTimeframes=state.optionalTimeframes.includes(key)?state.optionalTimeframes.filter(x=>x!==key):state.optionalTimeframes.concat([key]);render();return}
 const ev=e.target.closest("[data-event]");if(ev){state.selectedEvent=state.news[Number(ev.dataset.event)];state.sub="NEWS_INSTRUMENTS";render();return}
 const ni=e.target.closest("[data-news-instrument]");if(ni){state.selectedNewsInstrument=ni.dataset.newsInstrument;state.sub="NEWS_SIGNAL";render();loadNewsSignal();return}

 const toolIndex=e.target.closest("[data-tool-index]");if(toolIndex){state.toolIndex=Number(toolIndex.dataset.toolIndex)||0;render();return}const toolAction=e.target.closest("[data-tool-action]");if(toolAction){const action=toolAction.dataset.toolAction;if(action==="HIGH_IMPACT_NEWS")return openSub("HIGH_IMPACT_NEWS");if(action==="BROKER"){window.open("https://one.exnessonelink.com/a/gzhynodvm1","_blank","noopener");return}if(action==="COMMUNITY_LINK"){window.open("https://t.me/lamar_fx958","_blank","noopener");return}}const url=e.target.closest("[data-url]");if(url){window.open(url.dataset.url,"_blank","noopener");return}
});

 if(e.target.matches("[data-file]")){const key=e.target.dataset.file,file=e.target.files&&e.target.files[0];if(!file)return;try{state.images[key]=await compressFile(file);render()}catch(err){showMsg(err.message,"error")}}

})();
