<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAMAR TRADING BOT</title><style>body{margin:0;font-family:Inter,Arial;background:#080b12;color:#eef2ff}main{max-width:900px;margin:auto;padding:28px}.card{background:#111725;border:1px solid #252d3d;border-radius:18px;padding:22px;margin:16px 0}h1{margin:0 0 6px}.muted{color:#98a2b3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}select,input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #30394d;background:#0b101b;color:white;box-sizing:border-box}button{margin-top:18px;background:#6d5dfc;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.drop{border:1px dashed #48536a;padding:28px;text-align:center;border-radius:14px}.result{white-space:pre-wrap;line-height:1.55}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:#1b2435;margin:4px}</style></head><body><main><div class="card"><h1>LAMAR TRADING BOT</h1><div class="muted">Intelligent chart analysis • 4H + 15M</div></div><div class="card"><label>Instrument</label><select id="pair"><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>XAUUSD</option><option>GBPJPY</option><option>AUDUSD</option><option>USDCAD</option><option>USDCHF</option><option>EURGBP</option><option>BTCUSD</option></select></div><div class="grid"><div class="card"><h3>4H Chart</h3><div class="drop"><input id="h4" type="file" accept="image/*"></div></div><div class="card"><h3>15M Chart</h3><div class="drop"><input id="m15" type="file" accept="image/*"></div></div></div><button id="go" disabled>Analyze Chart</button><div id="out" class="card" style="display:none"><h2>Analysis</h2><div id="result" class="result"></div></div></main><script>const h4=document.querySelector('#h4'),m15=document.querySelector('#m15'),go=document.querySelector('#go'),out=document.querySelector('#out'),result=document.querySelector('#result');function ready(){go.disabled=!(h4.files[0]&&m15.files[0])}h4.onchange=ready;m15.onchange=ready;async function b64(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}go.onclick=async()=>{go.disabled=true;result.textContent='Analyzing both charts…';out.style.display='block';try{const body={instrument:document.querySelector('#pair').value,higher_timeframe_image:await b64(h4.files[0]),lower_timeframe_image:await b64(m15.files[0])};const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Analysis failed');result.textContent=JSON.stringify(data,null,2)}catch(e){result.textContent='Error: '+e.message}finally{go.disabled=false}};</script></body></html>
