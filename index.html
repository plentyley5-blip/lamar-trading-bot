function authView(){return `<div class="shell auth-shell">${brand()}<section class="glass auth-card"><h2 style="margin:0;font-size:22px;font-weight:900">${state.authMode==='signup'?'Create account':'Welcome back'}</h2><p class="muted small" style="margin:7px 0 17px">${state.authMode==='signup'?'Register to start analysing charts.':'Sign in to continue.'}</p>${state.authMode==='signup'?`<label class="field-label" for="auth-name">Full name</label><input class="field" id="auth-name" autocomplete="name" placeholder="Your full name">`:''}<div class="field-wrap"><label class="field-label" for="auth-email">Email</label><input class="field" id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field-wrap"><label class="field-label" for="auth-password">Password</label><input class="field" id="auth-password" type="password" autocomplete="${state.authMode==='signup'?'new-password':'current-password'}" placeholder="Password"></div>${state.authMode==='signup'?`<div class="field-wrap"><label class="field-label" for="auth-confirm">Confirm password</label><input class="field" id="auth-confirm" type="password" autocomplete="new-password" placeholder="Confirm password"></div>`:''}${state.authError?`<div class="error">${esc(state.authError)}</div>`:''}${state.authMessage?`<div class="success">${esc(state.authMessage)}</div>`:''}<button class="btn full" style="margin-top:19px" id="auth-submit" ${state.authBusy?'disabled':''}>${state.authBusy?'PLEASE WAIT…':state.authMode==='signup'?'CREATE ACCOUNT':'LOGIN'}</button><button class="auth-switch" id="auth-toggle">${state.authMode==='signup'?'Already have an account? Login':'Need an account? Create one'}</button></section><p class="auth-note">Sign in to access your personal analyses, subscription status and saved history.</p></div>`}
function nav(){return `<nav class="bottom-nav"><button class="nav-item ${state.page==='HOME'?'active':''}" data-page="HOME"><span class="nav-icon">⌂</span>HOME</button><button class="nav-item ${state.page==='MARKET'?'active':''}" data-page="MARKET"><span class="nav-icon">↗</span>MARKET</button><button class="nav-item ${state.page==='COMMUNITY'?'active':''}" data-page="COMMUNITY"><span class="nav-icon">◎</span>COMMUNITY</button><button class="nav-item ${state.page==='SAVED'?'active':''}" data-page="SAVED"><span class="nav-icon">▣</span>SAVED</button><button class="nav-item ${state.page==='PROFILE'?'active':''}" data-page="PROFILE"><span class="nav-icon">♙</span>PROFILE</button></nav>`}
function topbar(){const initial=(state.profile?.full_name||'L').trim().charAt(0).toUpperCase()||'L';return `<div class="top-row"><div class="mini-brand">LM ANALYZER<span>LAMAR TRADING BOT</span></div><div class="avatar">${esc(initial)}</div></div>`}
function toolCard(){if(state.tool===0){const events=state.news.slice(0,5);return `<article class="glass tool-card news"><div class="tool-icon">◷</div><div class="tool-badge">HIGH IMPACT NEWS</div><h3>Current market-moving events</h3><p>Keep an eye on economic releases that may increase volatility.</p>${state.newsLoading&&!events.length?loading('Loading current high-impact events…'):events.length?`<div class="news-list">${events.map(n=>`<div class="news-row"><span class="currency">${esc(n.currency||'—')}</span><div><div class="news-title">${esc(n.title||n.event||'High-impact event')}</div><div class="news-meta">${esc([n.date,n.time,n.impact].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`:`<div class="muted small" style="margin:10px 0 15px">${esc(state.newsError||'No high-impact events available right now.')}</div>`}<button class="btn subtle" data-action="news">${state.newsLoading?'REFRESHING…':'REFRESH NEWS'}</button></article>`}if(state.tool===1)return `<article class="glass tool-card"><div class="tool-icon">↗</div><div class="tool-badge">RECOMMENDED BROKER</div><h3>Trade with Exness</h3><p>Visit our recommended broker to review available trading accounts and services.</p><button class="btn" data-url="${EXNESS}">SIGN UP ↗</button><div style="position:absolute;right:18px;bottom:15px;font-size:42px;color:rgba(47,140,255,.16);font-weight:950">EX</div></article>`;return `<article class="glass tool-card"><div class="tool-icon">➤</div><div class="tool-badge">LAMAR TRADING COMMUNITY</div><h3>Connect with other traders</h3><p>Join the LAMAR Trading Community on Telegram for community updates and discussions.</p><button class="btn" data-url="${TELEGRAM}">JOIN COMMUNITY ↗</button></article>`}
function homeView(){const p=state.profile||{};const name=(p.full_name||'Trader').trim().split(/\s+/)[0]||'Trader';const count=Number(p.daily_analysis_count??p.dailyCount??state.dailyCount)||0;return `${topbar()}<section class="glass welcome"><div class="welcome-line">WELCOME TO LM ANALYZER</div><h1>Welcome, ${esc(name)}</h1><p>Ready to analyse the market?</p><div class="daily-pill">◷ &nbsp;Today’s analyses: ${count}/4</div></section><div class="tool-head"><h2 class="section-title">LM Analyzer Recommended Tools</h2><div class="dots">${[0,1,2].map(i=>`<span class="dot ${i===state.tool?'active':''}"></span>`).join('')}</div></div><div id="tool-container">${toolCard()}</div><div class="carousel-foot"><span>Auto-rotates every 10 seconds</span><span>${state.tool+1} / 3</span></div><section class="glass card" style="margin-bottom:14px"><div class="tool-head" style="margin-bottom:10px"><h2 class="section-title">TRADERS RIGHT NOW</h2><button class="back" data-action="load-markets">REFRESH</button></div><div class="stats-grid"><div class="stat-tile"><span>Completed analyses · 24h</span><strong>${state.traderStats?Number(state.traderStats.total_analyses||0):"—"}</strong></div><div class="stat-tile"><span>BUY / SELL</span><strong>${state.traderStats?`${Number(state.traderStats.buy_percent||0).toFixed(0)}% / ${Number(state.traderStats.sell_percent||0).toFixed(0)}%`:"—"}</strong></div></div><div class="market-strip" style="margin-top:10px">${state.marketQuotes.slice(0,4).map(q=>`<div class="market-mini"><div class="sym">${esc(q.symbol||"—")}</div><div class="price">${q.available&&q.price?esc(q.price):"—"}</div><div class="chg" style="color:${Number(q.change_percent)>=0?"var(--green)":"var(--red)"}">${q.change_percent==null?"Unavailable":`${Number(q.change_percent)>=0?"+":""}${Number(q.change_percent).toFixed(2)}%`}</div></div>`).join("")||`<div class="muted small">${esc(state.marketError||"Live market quotes will appear when available.")}</div>`}</div><p class="tool-note">Only provider-supplied quotes are displayed. No demo prices are substituted.</p></section><section class="glass analysis-promo"><h3>Chart Intelligence</h3><p>Select your market, upload 4H and 15M charts, and analyse the setup.</p><button class="star-button" id="start-analysis"><span class="star">✦</span><strong>START</strong><strong>ANALYSIS</strong></button><div class="muted small">4H context + 15M confirmation</div></section>`}
function signalColor(s){s=String(s||'').toUpperCase();return s==='BUY'?'var(--green)':s==='SELL'?'var(--red)':'var(--gold)'}
function resultCard(r){if(!r)return '';const lists=[['Contributing methods',r.contributing_methods],['Weak methods',r.weak_methods],['Conflicting methods',r.conflicting_methods],['Warnings',r.warnings]];return `<section class="glass result-card"><div class="result-top"><div><div class="eyebrow">TRADE DECISION</div><div class="signal-big" style="color:${signalColor(r.signal)}">${esc((r.signal||'NO TRADE').toUpperCase())}</div></div><div class="confidence">${Number(r.confidence)||0}%<small>analysis confidence</small></div></div><hr class="result-divider">${[['Instrument',r.instrument],['Trend',r.trend],['Trade idea',r.trade_idea],['Entry',r.entry],['Stop loss',r.stop_loss],['Take profit 1',r.take_profit_1],['Take profit 2',r.take_profit_2],['Risk / reward',r.risk_reward],['Duration',r.duration]].map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><span>${esc(v||'—')}</span></div>`).join('')}${[['4H context',r.higher_timeframe_context],['15M confirmation',r.lower_timeframe_confirmation],['Data analysis',r.data_analysis],['Explanation',r.explanation],['News & fundamental risk',r.news_fundamental_risk]].map(([k,v])=>`<div class="result-section"><h4>${esc(k)}</h4><p>${esc(v||'—')}</p></div>`).join('')}${lists.filter(x=>Array.isArray(x[1])&&x[1].length).map(([k,v])=>`<div class="result-section"><h4>${esc(k)}</h4><ul>${v.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`).join('')}</section>`}
function historyCard(item,i){const r=item.result||{};return `<button class="glass list-card" data-history="${i}" style="width:100%;text-align:left;color:#fff"><div class="list-top"><div><h3>${esc(item.instrument||r.instrument||'UNKNOWN')}</h3><div class="muted small">${esc(item.trade_focus||'ANALYSIS')} · ${esc(formatDate(item.created_at))}</div></div><div class="signal" style="color:${signalColor(r.signal)}">${esc((r.signal||'NO TRADE').toUpperCase())}</div></div><div class="list-bottom"><span>CONFIDENCE ${Number(r.confidence)||0}%</span><span>${esc(r.trend||'—')} &nbsp;›</span></div></button>`}
function formatDate(value){if(!value)return 'Date unavailable';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()}
function savedView(){if(state.selectedHistory!==null){const item=state.history[state.selectedHistory];return `<div class="screen-header"><button class="back" data-action="history-back">← BACK</button><div><h1>Saved Analysis</h1><p>${esc(item?.instrument||'Analysis details')}</p></div></div>${resultCard(item?.result||{})}`}return `<div class="page-head"><h1>SAVED</h1><p>Your completed chart analyses</p></div>${state.historyBusy?loading('Loading your saved analyses…'):state.historyError?`<div class="error">${esc(state.historyError)}</div><button class="btn outline" data-action="reload-history">TRY AGAIN</button>`:state.history.length?state.history.map(historyCard).join(''):`<div class="glass card"><h3 style="margin:0 0 7px">No saved analyses yet</h3><p class="muted small" style="margin:0">Completed analyses will appear here when your account history is available.</p><button class="btn" style="margin-top:14px" data-action="go-analyzer">START ANALYSIS</button></div>`}`}

gn-items:center;gap:8px"><div><h2 style="margin:0 0 4px">LM SUPPORT BOT</h2><p class="muted small">Your saved support conversations</p></div><button class="btn outline" data-action="chat-new">NEW</button></div><div class="btn-row" style="margin:12px 0"><button class="btn subtle" data-action="chat-history-toggle">${state.chatShowHistory?'HIDE HISTORY':`HISTORY (${state.chatConversations.length})`}</button><button class="btn outline" data-action="chat-refresh">REFRESH</button></div>${state.chatShowHistory?`<div class="chat-history">${state.chatConversations.length?state.chatConversations.map(c=>`<button class="option" data-chat-conversation="${esc(c.id)}"><strong>${esc(c.title||'Support conversation')}</strong><small>${esc(String(c.updated_at||c.created_at||'').replace('T',' ').slice(0,16))}</small></button>`).join(''):'<p class="muted small">No saved conversations yet.</p>'}</div>`:''}<div id="support-chat-messages" class="support-chat-messages">${state.chatLoading?loading('Loading your saved conversation…'):state.chatMessages.length?state.chatMessages.map(m=>`<div class="chat-bubble ${m.role==='user'?'chat-user':'chat-bot'}"><div class="chat-role">${m.role==='user'?'YOU':'LM SUPPORT BOT'}</div><div>${esc(m.content)}</div></div>`).join(''):'<p class="muted small">Send a message to start chatting with LM support.</p>'}</div>${state.chatError?`<div class="error">${esc(state.chatError)}</div>`:''}${state.chatNotice?`<p class="success">${esc(state.chatNotice)}</p>`:''}<form id="support-chat-form"><label class="field-label" for="support-chat-draft">Your message</label><textarea id="support-chat-draft" class="field" rows="3" maxlength="4000" placeholder="Ask LM Support Bot for help…" required></textarea><button class="btn full" style="margin-top:10px" type="submit" ${state.chatBusy?'disabled':''}>${state.chatBusy?'SENDING…':'SEND MESSAGE'}</button></form><p class="muted small" style="margin-top:12px">For human assistance, use Help & Support in your profile to contact the official Telegram support team.</p></section>`;if(state.subPage==='MARKETS')return `${back}<section class="glass card"><h2>Live Markets</h2><p class="muted small">Quotes from the configured market-data provider. Unavailable prices are never replaced with demo values.</p><button class="btn full" data-action="load-markets">${state.marketBusy?'LOADING…':'REFRESH LIVE MARKETS'}</button>${state.marketError?`<div class="error">${esc(state.marketError)}</div>`:''}<div class="market-strip" style="margin-top:12px">${state.marketQuotes.length?state.marketQuotes.map(q=>`<div class="market-mini"><div class="sym">${esc(q.symbol||'—')}</div><div class="price">${q.available&&q.price?esc(q.price):'—'}</div><div class="chg" style="color:${Number(q.change_percent)>=0?'var(--green)':'var(--red)'}">${q.change_percent==null?'Unavailable':`${Number(q.change_percent)>=0?'+':''}${Number(q.change_percent).toFixed(2)}%`}</div></div>`).join(''):'<p class="muted small">Tap refresh to load live quotes.</p>'}</div><button class="btn full" data-action="go-analyzer">START AI ANALYSIS</button></section>`;if(state.subPage==='LEARNING')return `${back}<section class="glass card"><h2>Premium Learning Hub</h2><p class="muted small">Trading lessons and progress are loaded from your account's trader-tools service.</p><button class="btn full" data-action="load-lessons">${state.marketBusy?'LOADING…':'LOAD LESSONS'}</button>${state.toolError?`<div class="error">${esc(state.toolError)}</div>`:''}${state.lessons.map(l=>`<article class="glass card" style="margin-top:9px"><div class="eyebrow">${esc(l.level||l.category||'LESSON')}</div><h3>${esc(l.title||'Trading lesson')}</h3><p class="muted small">${esc(l.summary||'')}</p><p class="small muted">${esc(String(l.minutes||'—'))} min</p></article>`).join('')||'<p class="muted small">No lessons loaded yet.</p>'}</section>`;if(state.subPage==='RISK')return `${back}<section class="glass card"><h2>Smart Risk Manager</h2><p class="muted small">Estimate cash risk and price elect></label><label>Notes and lessons<textarea id="journal-notes"></textarea></label></div><button class="btn full" style="margin-top:12px" data-action="save-journal">SAVE JOURNAL ENTRY</button>${state.toolNotice?`<p class="success">${esc(state.toolNotice)}</p>`:''}${state.toolError?`<div class="error">${esc(state.toolError)}</div>`:''}<h3 style="margin-top:18px">Recent entries</h3>${state.journalEntries.map(j=>`<article class="glass card" style="margin-top:8px"><strong>${esc(j.instrument||'—')} · ${esc(j.direction||'—')}</strong><p class="muted small">${esc(j.outcome||'PLANNED')} · Balance ${esc(j.account_balance||'—')} · Risk ${esc(j.risk_percent||'—')}%</p><p class="small">${esc(j.notes||'')}</p></article>`).join('')||'<p class="muted small">Load or save an entry to see your journal.</p>'}</section>`;if(state.subPage==='FEEDBACK')return `${back}<section class="glass card"><h2>Analysis Feedback</h2><p class="muted small">Report an inaccurate result, unclear explanation, or app error. Do not include passwords or payment details.</p><div class="tool-form"><label>Feedback type<select id="feedback-type"><option>ANALYSIS_QUALITY</option><option>APP_BUG</option><option>ACCOUNT</option><option>OTHER</option></select></label><label>Instrument (optional)<input id="feedback-instrument" maxlength="20" placeholder="e.g. XAUUSD"></label><label>Describe the issue<textarea id="feedback-message" required></textarea></label></div><button class="btn full" style="margin-top:12px" data-action="send-feedback">SEND FEEDBACK</button>${state.toolNotice?`<p class="success">${esc(state.toolNotice)}</p>`:''}${state.toolError?`<div class="error">${esc(state.toolError)}</div>`:''}</section>`;return `${back}`}

function subTitle(){return ({SETTINGS:'SETTINGS',GUIDE:'SCREENSHOT GUIDE',PLANS:'PLANS',COMMUNITY:'COMMUNITY',SUPPORT:'HELP & SUPPORT',LIVE_CHAT:'LM SUPPORT BOT'})[state.subPage]||''}function subSubtitle(){return ({SETTINGS:'LM Analyzer preferences',GUIDE:'Get clearer chart evidence',PLANS:'Choose your LM Analyzer subscription',COMMUNITY:'Connect with LAMAR',SUPPORT:'Contact LAMAR support on Telegram',LIVE_CHAT:'Your ongoing support conversation'})[state.subPage]||''}
function marketPageView(){const quotes=state.marketQuotes||[];const names={XAUUSD:'Gold / US Dollar',EURUSD:'Euro / US Dollar',GBPUSD:'British Pound / US Dollar',USDJPY:'US Dollar / Japanese Yen',BTCUSD:'Bitcoin / US Dollar',US500:'S&P 500 Index'};return `${topbar()}<div class="page-head"><h1>LIVE MARKET</h1><p>Live prices from the configured market-data provider</p></div><section class="glass card"><div class="tool-head"><h2 class="section-title">LIVE QUOTES</h2><button class="back" data-action="load-markets">${state.marketBusy?'LOADING…':'REFRESH'}</button></div>${state.marketError?`<div class="error">${esc(state.marketError)}</div>`:''}${state.marketBusy&&!quotes.length?loading('Loading live prices…'):''}<div class="market-strip">${quotes.length?quotes.map(q=>`<article class="market-mini"><div class="sym">${esc(q.symbol||'—')}</div><div class="muted small">${esc(names[q.symbol]||q.symbol||'Market')}</div><div class="price">${q.available&&q.price?esc(q.price):'—'}</div><div class="chg" style="color:${q.change_percent==null?'var(--muted)':Number(q.change_percent)>=0?'var(--green)':'var(--red)'}">${q.change_percent==null?'Unavailable':`${Number(q.change_percent)>=0?'+':''}${Number(q.change_percent).toFixed(2)}%`}</div><button class="btn subtle full" style="margin-top:10px" data-market-symbol="${esc(q.symbol||'')}" ${!q.symbol?'disabled':''}>ANALYSE</button></article>`).join(''):'<p class="muted small">No live quotes are available yet. Tap Refresh to try again.</p>'}</div><p class="tool-note">Prices are shown only when returned by the configured provider; unavailable quotes are not replaced with demo values.</p></section>`}
function communityPageView(withBack=false){const p=state.profile||{};const own=String(p.id||p.user_id||'');return `${withBack?`<div class="screen-header"><button class="back" data-action="sub-back">← BACK</button><div><h1>COMMUNITY</h1><p>LM Analyzer member feed</p></div></div>`:topbar()}<div class="page-head"><h1>COMMUNITY</h1><p>Share trading ideas and updates with LM Analyzer members</p></div><section class="glass card" style="margin-bottom:13px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:rgba(22,119,255,.2);font-weight:950;font-size:19px">LM</div><div><h2 style="margin:0 0 4px">LM Analyzer Community</h2><div class="muted small">Members-only feed · Saved to your account</div></div><button class="back" style="margin-left:auto" data-action="community-refresh">${state.communityBusy?'LOADING…':'REFRESH'}</button></div>${state.communityCanPost?`<form id="community-post-form"><label class="field-label" for="community-post-body">Write a community post</label><textarea class="field" id="community-post-body" rows="4" maxlength="5000" placeholder="Share a trading idea, lesson, or update…" required></textarea><div class="muted small" style="margin:7px 0 12px">Maximum 5,000 characters. Do not share passwords or private account details.</div><button class="btn full" type="submit" ${state.communityPosting?'disabled':''}>${state.communityPosting?'PUBLISHING…':'PUBLISH POST'}</button></form>`:`<div class="muted small" style="line-height:1.6">Publishing is available to active LM Analyzer subscribers and the owner. You can still read published community posts below.</div><button class="btn full" style="margin-top:12px" data-subpage="PLANS">VIEW SUBSCRIPTION PLANS</button>`}${state.communityError?`<div class="error">${esc(state.communityError)}</div>`:''}${state.communityNotice?`<div class="success">${esc(state.communityNotice)}</div>`:''}</section><div class="tool-head"><h2 class="section-title">LATEST POSTS</h2><span class="muted small">${state.communityPosts.length} shown</span></div>${state.communityBusy&&!state.communityPosts.length?loading('Loading community posts…'):''}${!state.communityBusy&&!state.communityPosts.length&&!state.communityError?`<section class="glass card"><p class="muted small" style="margin:0">No published posts yet. Be the first to share an update if your account can publish.</p></section>`:''}${state.communityPosts.map(post=>{const id=esc(post.id||'');const isOwn=own&&String(post.user_id||'')===own;return `<article class="glass card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><strong style="font-size:13px">${isOwn?'You':'LM Analyzer member'}</strong><div class="muted small" style="margin-top:4px">${esc(post.created_at?new Date(post.created_at).toLocaleString():'Recently published')}</div></div>${isOwn||p.is_owner||p.isOwner?`<button class="back" data-community-delete="${id}">DELETE</button>`:''}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;margin-top:13px">${esc(post.body||'')}</div>${post.image_url?`<img src="${esc(post.image_url)}" alt="Community post image" loading="lazy" style="display:block;width:100%;height:auto;border-radius:12px;margin-top:12px">`:''}</article>`}).join('')}<section class="glass card" style="margin-top:12px"><p class="muted small" style="line-height:1.6;margin:0 0 12px">Want Telegram channel announcements too? Open Telegram separately; it is not embedded in this website.</p><button class="btn full" data-url="${TELEGRAM}">OPEN TELEGRAM CHANNEL ↗</button></section>`}
async function loadCommunity(){if(state.communityBusy)return;state.communityBusy=true;state.communityError='';state.communityNotice='';render();try{const d=await api('/community',{timeout:30000});state.communityPosts=Array.isArray(d.posts)?d.posts:[];state.communityCanPost=!!d.can_post;if(state.profile){state.profile.user_id=d.user_id||state.profile.user_id;state.profile.id=state.profile.id||d.user_id}state.communityError=''}catch(e){state.communityError=e.message||'Unable to load community posts.'}finally{state.communityBusy=false;if(state.page==='COMMUNITY'||state.subPage==='COMMUNITY')render()}}
async function publishCommunityPost(){if(state.communityPosting)return;const input=$('#community-post-body');const body=(input?.value||'').trim();if(!body){state.communityError='Write something before publishing.';render();return}state.communityPosting=true;state.communityError='';state.communityNotice='';render();try{const d=await api('/community',{method:'POST',body:{body},timeout:30000});if(!d.post)throw new Error('The server did not confirm the published post.');state.communityPosts=[d.post,...state.communityPosts.filter(x=>String(x.id)!==String(d.post.id))];state.communityCanPost=true;state.communityNotice='Post published successfully.';render()}catch(e){state.communityError=e.message||'Your post could not be published.';render()}finally{state.communityPosting=false;render()}}
async function deleteCommunityPost(id){if(!id||!confirm('Delete this community post?'))return;state.communityError='';state.communityNotice='';try{await api('/community?post_id='+encodeURIComponent(id),{method:'DELETE',timeout:30000});state.communityPosts=state.communityPosts.filter(p=>String(p.id)!==String(id));state.communityNotice='Post deleted.'}catch(e){state.communityError=e.message||'Post could not be deleted.'}render()}
function render(){const app=$('#app');if(!state.token||!state.profile){app.innerHTML=authView();bindAuth();return}let body;if(state.page==='ANALYZER')body=analyzerView();else if(state.page==='SAVED')body=savedView();else if(state.page==='PROFILE')body=state.subPage?subView():profileView();else if(state.page==='MARKET')body=marketPageView();else if(state.page==='COMMUNITY')body=communityPageView();else body=homeView();app.innerHTML=`<div class="shell">${body}</div>${state.page==='ANALYZER'||state.subPage?'':nav()}`;bindApp()}
function bindAuth(){$('#auth-toggle')?.addEventListener('click',()=>{state.authMode=state.authMode==='login'?'signup':'login';state.authError='';state.authMessage='';render()});$('#auth-submit')?.addEventListener('click',submitAuth);$('#auth-password')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()})}
async function submitAuth(){if(state.authBusy)return;const email=$('#auth-email')?.value.trim()||'',password=$('#auth-password')?.value||'',name=$('#auth-name')?.value.trim()||'',confirm=$('#auth-confirm')?.value||'';state.authError='';state.authMessage='';if(!email||!password){state.authError='Email and password are required.';render();return}if(state.authMode==='signup'&&(!name||!confirm)){state.authError='Please complete all fields.';render();return}if(state.authMode==='signup'&&password!==confirm){state.authError='Passwords do not match.';render();return}state.authBusy=true;render();try{if(state.authMode==='signup'){const r=await api('/auth',{method:'POST',auth:false,body:{action:'signup',full_name:name,email,password,confirm_password:confirm}});state.authMessage=r.message||'Account created. Please log in.';state.authMode='login'}else{const r=await api('/auth',{method:'POST',auth:false,body:{action:'login',email,password}});const access=r.access_token||'';if(!access)throw new Error('Login succeeded without a session token.');state.token=access;state.refresh=r.refresh_token||'';localStorage.setItem('lm_access_token',state.token);localStorage.setItem('lm_refresh_token',state.refresh);await loadProfile();state.page='HOME';state.authBusy=false;render();loadNews();return}}catch(e){state.authError=e.message||'Authentication failed.'}finally{state.authBusy=false;render()}}

async function loadHistory(){state.historyBusy=true;state.historyError='';render();try{const r=await api('/analysis_history');state.history=Array.isArray(r.history)?r.history:[]}catch(e){state.historyError=e.message||'Unable to load saved analyses.'}finally{state.historyBusy=false;render()}}
function bindApp(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;state.subPage='';state.selectedHistory=null;render();if(state.page==='SAVED'||state.page==='PROFILE')loadHistory();if(state.page==='MARKET')loadMarkets();if(state.page==='COMMUNITY')loadCommunity()}));document.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{state.selectedPlan=b.dataset.plan;state.paymentMessage='';render()}));document.querySelectorAll('[data-market-symbol]').forEach(b=>b.addEventListener('click',()=>{const p=state.profile||{};if(!(p.is_owner||p.subscription_active)){state.page='PROFILE';state.subPage='PLANS';render();toast('An active subscription is required.');return}state.page='ANALYZER';state.selectedInstrument=b.dataset.marketSymbol||'';state.h4=null;state.m15=null;state.h4Data='';state.m15Data='';state.result=null;state.analysisError='';render();openInstrumentModal()}));document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.url,'_blank','noopener,noreferrer')));document.querySelectorAll('[data-subpage]').forEach(b=>b.addEventListener('click',()=>{state.subPage=b.dataset.subpage;state.toolError='';state.toolNotice='';render();if(state.subPage==='MARKETS')loadMarkets();if(state.subPage==='JOURNAL')loadJournal();if(state.subPage==='LEARNING')loadLessons();if(state.subPage==='LIVE_CHAT')loadSupportConversations();if(state.subPage==='COMMUNITY')loadCommunity()}));document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{state.focus=b.dataset.focus;render()}));document.querySelectorAll('[data-history]').forEach(b=>b.addEventListener('click',()=>{state.selectedHistory=Number(b.dataset.history);render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.action==='community-refresh'){loadCommunity();return}handleAction(b.dataset.action)}));document.querySelectorAll('[data-community-delete]').forEach(b=>b.addEventListener('click',()=>deleteCommunityPost(b.dataset.communityDelete)));$('#community-post-form')?.addEventListener('submit',e=>{e.preventDefault();publishCommunityPost()});$('#start-analysis')?.addEventListener('click',()=>{const p=state.profile||{};if(!(p.is_owner||p.subscription_active)){state.page='PROFILE';state.subPage='PLANS';render();toast('An active subscription is required.');return}state.page='ANALYZER';state.selectedInstrument='';state.h4=null;state.m15=null;state.result=null;state.analysisError='';render();openInstrumentModal()} );$('#h4-file')?.addEventListener('change',e=>handleImage(e.target.files?.[0],'h4'));$('#m15-file')?.addEventListener('change',e=>handleImage(e.target.files?.[0],'m15'));$('#analyze-submit')?.addEventListener('click',submitAnalysis);$('#notifications-toggle')?.addEventListener('change',e=>{state.notifications=e.target.checked;localStorage.setItem('lm_notifications',String(state.notifications));toast('Preference saved on this browser.')});$('#avatar-file')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Choose an image file.');return}try{const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Could not read that photo.'));r.readAsDataURL(file)});const img=new Image();img.src=raw;await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('That photo could not be opened.'))});const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.78);localStorage.setItem(avatarStorageKey(state.profile?.email),data);toast('Profile photo updated on this device.');render()}catch(err){toast(err.message||'Could not save profile photo.')}});$('#support-chat-form')?.addEventListener('submit',e=>{e.preventDefault();sendSupportChatMessage()});document.querySelectorAll('[data-chat-conversation]').forEach(b=>b.addEventListener('click',()=>{state.chatError='';state.chatNotice='';loadSupportMessages(b.dataset.chatConversation)}))}
async function loadSupportConversations(){state.chatError='';state.chatLoading=true;render();try{const d=await api('/support_chat');state.chatConversations=Array.isArray(d.conversations)?d.conversations:[];if(!state.chatConversationId&&state.chatConversations.length){const latest=[...state.chatConversations].sort((a,b)=>String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||'')))[0];state.chatConversationId=latest.id;await loadSupportMessages(latest.id,false)}}catch(e){state.chatError=e.message||'Unable to load support conversations.'}finally{state.chatLoading=false;render()}}
async function loadSupportMessages(id,rerender=true){try{const d=await api('/support_chat?conversation_id='+encodeURIComponent(id));state.chatMessages=Array.isArray(d.messages)?d.messages:[];state.chatConversationId=id;if(rerender)render()}catch(e){state.chatError=e.message||'Unable to open this conversation.';if(rerender)render()}}
async function sendSupportChatMessage(){const input=$('#support-chat-draft');const message=(input?.value||'').trim();if(!message||state.chatBusy)return;state.chatBusy=true;state.chatError='';state.chatNotice='';render();try{const body={action:'send',message};if(state.chatConversationId)body.conversation_id=state.chatConversationId;const d=await api('/support_chat',{method:'POST',body,timeout:60000});if(!d.conversation_id||!d.reply)throw new Error('The support bot returned an incomplete response.');state.chatConversationId=d.conversation_id;state.chatMessages=[...state.chatMessages,{id:'local-user-'+Date.now(),role:'user',content:message},{id:'local-bot-'+Date.now(),role:'assistant',content:d.reply}];state.chatNotice='Conversation saved.';const list=await api('/support_chat');state.chatConversations=Array.isArray(list.conversations)?list.conversations:state.chatConversations;render()}catch(e){state.chatError=e.message||'The support bot is temporarily unavailable.';render()}finally{state.chatBusy=false;render()}}
async function startSubscriptionCheckout(){if(state.paymentBusy)return;if(!state.token){state.paymentMessage='ERROR: Your session has expired. Please sign in again.';render();return}state.paymentBusy=true;state.paymentMessage='Preparing secure Pesapal checkout…';render();try{const result=await api('/pesapal?action=create',{method:'POST',body:{plan:state.selectedPlan},timeout:45000});const url=String(result.redirect_url||'').trim();if(!url.startsWith('https://'))throw new Error(result.message||'Pesapal did not return a valid secure checkout link.');state.paymentMessage='Opening secure Pesapal checkout. Complete payment there; your subscription activates after payment is verified.';render();window.location.assign(url)}catch(e){state.paymentMessage='ERROR: '+(e.message||'Unable to start payment. Please try again.');render()}finally{state.paymentBusy=false}}
function handleAction(action){if(action==='pay-subscription'){startSubscriptionCheckout()}if(action==='change-avatar'){$('#avatar-file')?.click()}if(action==='chat-history-toggle'){state.chatShowHistory=!state.chatShowHistory;render()}if(action==='chat-refresh')loadSupportConversations();if(action==='chat-new'){state.chatConversationId='';state.chatMessages=[];state.chatError='';state.chatNotice='';state.chatShowHistory=false;render()}if(action==='news')loadNews();if(action==='load-markets')loadMarkets();if(action==='load-lessons')loadLessons();if(action==='reload-history')loadHistory();if(action==='share'){if(navigator.share){navigator.share({title:'LM Analyzer',text:'Try LM Analyzer by LAMAR Trading Bot',url:location.origin}).catch(()=>{})}else{navigator.clipboard?.writeText(location.origin).then(()=>toast('Website link copied.')).catch(()=>toast(location.origin))}}if(action==='calculate-risk'){const n=id=>Number(document.getElementById(id)?.value);const bal=n('risk-balance'),pct=n('risk-percent'),entry=n('risk-entry'),stop=n('risk-stop'),target=n('risk-target');const risk=bal*pct/100,dist=Math.abs(entry-stop),reward=Math.abs(target-entry),rr=dist>0?reward/dist:NaN;const valid=Number.isFinite(risk)&&bal>0&&pct>0&&pct<=10;const out=document.getElementById('risk-result');if(out)out.innerHTML=`<div class="info-line"><span>Planned cash risk</span><strong>${valid?risk.toFixed(2):'Enter valid balance and risk % (max 10%)'}</strong></div><div class="info-line"><span>Entry-to-stop distance</span><strong>${Number.isFinite(dist)&&dist>0?dist.toPrecision(7):'Enter valid entry and stop'}</strong></div><div class="info-line"><span>Price-distance R:R</span><strong>${Number.isFinite(rr)&&rr>0?'1 : '+rr.toFixed(2):'Enter valid entry, stop and target'}</strong></div><p class="tool-note">Lot size is not calculated because broker tick specifications have not been supplied.</p>`}if(action==='save-journal'){(async()=>{state.toolError='';state.toolNotice='';try{const v=id=>document.getElementById(id)?.value?.trim()||'';const body={instrument:v('journal-instrument').toUpperCase(),direction:v('journal-direction'),account_balance:Number(v('journal-balance')),risk_percent:Number(v('journal-risk')),outcome:v('journal-outcome'),notes:v('journal-notes')};if(!body.instrument)throw new Error('Enter an instrument.');if(!Number.isFinite(body.account_balance)||body.account_balance<=0)throw new Error('Enter a valid account balance.');if(!Number.isFinite(body.risk_percent)||body.risk_percent<=0||body.risk_percent>10)throw new Error('Risk must be between 0 and 10%.');for(const [id,key] of [['journal-entry','entry_price'],['journal-stop','stop_loss'],['journal-target','take_profit']]){const raw=v(id);if(raw){body[key]=Number(raw);if(!Number.isFinite(body[key]))throw new Error('Prices must be numeric.')}}await traderTools('journal',{method:'POST',body});state.toolNotice='Saved journal entry.';await loadJournal()}catch(e){state.toolError=e.message||'Unable to save journal entry.'}render()})()}if(action==='send-feedback'){(async()=>{state.toolError='';state.toolNotice='';try{const message=document.getElementById('feedback-message')?.value?.trim()||'';if(!message)throw new Error('Describe the issue before sending.');await traderTools('feedback',{method:'POST',body:{feedback_type:document.getElementById('feedback-type')?.value||'OTHER',instrument:document.getElementById('feedback-instrument')?.value?.trim()||'',message}});state.toolNotice='Feedback sent. Thank you.'}catch(e){state.toolError=e.message||'Feedback could not be sent.'}render()})()}if(action==='go-analyzer'){state.page='ANALYZER';render();openInstrumentModal()}if(action==='analyzer-back'){state.page='HOME';state.result=null;render()}if(action==='sub-back'){state.subPage='';render()}if(action==='history-back'){state.selectedHistory=null;render()}if(action==='open-instruments')openInstrumentModal();if(action==='logout'){state.token='';state.refresh='';state.profile=null;state.page='HOME';state.subPage='';localStorage.removeItem('lm_access_token');localStorage.removeItem('lm_refresh_token');render()}if(action==='delete-account')toast('Account deletion is not connected to the backend yet. Please contact support.');}
function openInstrumentModal(){const root=$('#modal-root');root.innerHTML=`<div class="instrument-overlay" id="instrument-overlay"><section class="glass instrument-modal"><div class="modal-head"><div><h2>Choose Instrument</h2><p>Select the market you want LM Analyzer to analyse.</p></div><button class="close" id="instrument-close" aria-label="Close">×</button></div><input class="field" id="instrument-search" placeholder="Search instrument…" autocomplete="off"><div class="instrument-list" id="instrument-list"></div></section></div>`;const draw=()=>{const q=($('#instrument-search').value||'').trim().toUpperCase();const filtered=GROUPS.map(g=>({...g,items:g.items.filter(x=>x.includes(q))})).filter(g=>g.items.length);$('#instrument-list').innerHTML=filtered.length?filtered.map(g=>`<div class="group-title">${esc(g.name)}</div>${g.items.map(x=>`<div class="instrument-option ${state.selectedInstrument===x?'selected':''}" data-instrument="${x}"><span class="instrument-symbol">◆</span><span>${x}</span>${state.selectedInstrument===x?'<span class="check">✓</span>':''}</div>`).join('')}`).join(''):`<div class="muted small" style="text-align:center;padding:25px">No instrument found. Try another symbol.</div>`;root.querySelectorAll('[data-instrument]').forEach(el=>el.addEventListener('click',()=>{state.selectedInstrument=el.dataset.instrument;root.innerHTML='';render()}))};$('#instrument-search').addEventListener('input',draw);$('#instrument-close').addEventListener('click',()=>root.innerHTML='');$('#instrument-overlay').addEventListener('click',e=>{if(e.target.id==='instrument-overlay')root.innerHTML=''});draw()}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read the selected image.'));reader.readAsDataURL(file)})}
async function handleImage(file,which){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Choose a PNG, JPG or WEBP image.');return}try{let data=await fileToDataUrl(file);if(data.length*0.75>MAX_IMAGE_BYTES){data=await compressDataUrl(data);if(data.length*0.75>MAX_IMAGE_BYTES)throw new Error('Chart image is too large after compression. Use a smaller screenshot.')}state[which]=data;state.analysisError='';render()}catch(e){toast(e.message||'Image upload failed.')}}
async function compressDataUrl(data){const img=new Image();img.src=data;await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('The selected image could not be decoded.'))});const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);let quality=.82;let out=c.toDataURL('image/jpeg',quality);while(out.length*.75>MAX_IMAGE_BYTES&&quality>.58){quality-=.06;out=c.toDataURL('image/jpeg',quality)}return out}
async function submitAnalysis(){if(state.analyzing)return;const p=state.profile||{};const owner=!!p.is_owner,active=!!p.subscription_active,count=Number(p.daily_analysis_count??state.dailyCount)||0;if(!(owner||active)){state.analysisError='An active LM Analyzer subscription is required.';render();return}if(!state.selectedInstrument){openInstrumentModal();return}if(!state.h4||!state.m15){state.analysisError='Upload both the 4H and 15M charts first.';render();return}if(!owner&&count>=4){state.analysisError='Daily analysis limit reached.';render();return}state.analyzing=true;state.analysisError='';state.result=null;render();try{const submit=await api('/analysis_submit',{method:'POST',timeout:90000,body:{instrument:state.selectedInstrument,trade_focus:state.focus,higher_timeframe_image:state.h4,lower_timeframe_image:state.m15}});const job=submit.job_id;if(!job)throw new Error('The analysis job was not created.');let result=null;let last='queued';for(let i=0;i<75&&result===null;i++){await new Promise(r=>setTimeout(r,2000));const status=await api('/analysis_status?job_id='+encodeURIComponent(job),{timeout:30000});last=status.status||last;if(last==='completed')result=status.result||{};else if(last==='failed')throw new Error(status.error||'The analysis did not complete.')}if(!result)throw new Error('The analysis is taking longer than expected. Please try again.');state.result=result;if(!owner){state.dailyCount=count+1;if(state.profile){state.profile.daily_analysis_count=state.dailyCount;state.profile.dailyCount=state.dailyCount}}render();toast('Analysis completed.')}catch(e){state.analysisError=e.name==='AbortError'?'The request timed out. Please try again.':e.message||'Analysis failed.';render()}finally{state.analyzing=false;render()}}
// Match Android's ten-second recommended-tool rotation.
setInterval(()=>{if(state.token&&state.profile&&state.page==='HOME'&&!state.subPage){state.tool=(state.tool+1)%3;const c=$('#tool-container');if(c)c.innerHTML=toolCard();const d=document.querySelector('.dots');if(d)d.innerHTML=[0,1,2].map(i=>`<span class="dot ${i===state.tool?'active':''}"></span>`).join('');const f=document.querySelector('.carousel-foot');if(f)f.innerHTML=`<span>Auto-rotates every 10 seconds</span><span>${state.tool+1} / 3</span>`}},10000);
startup();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('Offline shell registration unavailable:',e.message))); }
</script></body></html>
